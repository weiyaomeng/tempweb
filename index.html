<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake or Fact: Who Has Got the Robot Radar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .hidden {
            display: none;
        }
        .review {
            padding: 15px;
            display: none;
        }
        .review.active {
            display: block;
        }
        .review-title {
            font-size: 1.2em;
            font-weight: bold;
        }
        .review-text {
            margin: 10px 0;
        }
        .rating {
            color: #ffc107;
        }
        .helpful {
            font-size: 0.9em;
            color: #555;
        }
        .images img {
            width: 100px;
            height: auto;
            margin-right: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        .classification {
            margin-top: 10px;
        }
        .navigation {
            margin-top: 20px;
        }
        .navigation button {
            padding: 10px 15px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
        }
        .navigation button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container" id="welcomeContainer">
        <h1>Fake or Fact: Who Has Got the Robot Radar?</h1>
        <p>Enter your name to start the challenge:</p>
        <input type="text" id="userName" placeholder="Your name" />
        <button onclick="startChallenge()">Start Challenge</button>
    </div>

    <div class="container hidden" id="reviewContainer">
        <h1>Fake or Fact: Who Has Got the Robot Radar?</h1>
        <h2 id="welcomeMessage"></h2>
        <div id="reviewContent"></div>
    </div>

    <script>
        // Store parsed CSV data
        let productData = [];
        let reviewData = [];
        let currentReviewIndex = 0; // Start with the first review
        let userName = "";

        // Load and parse the 'meta.csv' file (product information)
        function loadMetaData() {
            console.log("Loading meta data...");

            Papa.parse("data/meta.csv", {
                download: true,
                header: true,
                dynamicTyping: true,
                complete: function(results) {
                    productData = results.data; // Store the parsed product data
                    console.log("Meta Data Loaded:", productData); // Log the product data

                    loadReviewData(); // Load review data after product data is loaded
                },
                error: function(error) {
                    console.error("Error loading meta data:", error); // Log error
                }
            });
        }

        // Load and parse the 'review.csv' file (reviews)
        function loadReviewData() {
            console.log("Loading review data...");

            Papa.parse("data/review.csv", {
                download: true,
                header: true,
                dynamicTyping: true,
                complete: function(results) {
                    reviewData = results.data; // Store the parsed review data
                    console.log("Review Data Loaded:", reviewData); // Log the review data

                    renderReviews(); // Render reviews once both datasets are loaded
                },
                error: function(error) {
                    console.error("Error loading review data:", error); // Log error
                }
            });
        }

        // Function to render reviews with product information
        function renderReviews() {
            const reviewContainer = document.getElementById('reviewContent');
            reviewContainer.innerHTML = ''; // Clear existing content

            console.log("Rendering reviews...");

            // Ensure there are reviews to show
            if (reviewData.length === 0) {
                reviewContainer.innerHTML = "<p>No reviews available to display.</p>";
                return;
            }

            reviewData.forEach(review => {
                const product = productData.find(product => product.parent_asin === review.parent_asin);

                if (product) {
                    const reviewHTML = `
                        <div class="review ${currentReviewIndex === 0 ? 'active' : ''}" id="review_${currentReviewIndex}">
                            <h3>${product.title}</h3>
                            <p><strong>Price:</strong> $${product.price}</p>
                            <p><strong>Rating:</strong> ${product.average_rating} (${product.rating_number} reviews)</p>
                            <div class="product-info">
                                <h4>Features:</h4>
                                <ul>
                                    ${product.features.map(feature => `<li>${feature}</li>`).join('')}
                                </ul>
                            </div>
                            <p><strong>Review:</strong></p>
                            <div class="review-text">${review.text}</div>
                            <div class="classification">
                                <button class="real" onclick="submitToForm('Real', '${review.id}')">Real</button>
                                <button class="machine" onclick="submitToForm('Machine-Generated', '${review.id}')">Machine-Generated</button>
                            </div>
                        </div>
                    `;
                    reviewContainer.innerHTML += reviewHTML;
                    currentReviewIndex++;
                }
            });
        }

        // Function to start the challenge
        function startChallenge() {
            const input = document.getElementById('userName');
            if (!input.value.trim()) {
                alert("Please enter your name to start the challenge.");
                return;
            }
            userName = input.value.trim();
            document.getElementById('welcomeContainer').classList.add('hidden');
            document.getElementById('reviewContainer').classList.remove('hidden');
            document.getElementById('welcomeMessage').textContent = `Welcome, ${userName}! Let's get started.`;
            loadMetaData(); // Start loading CSV files
        }

        // Function to submit the user's decision to Google Form
        function submitToForm(decision, reviewId) {
            const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSdWrYS9K5H5dtHMXn8w5OA0Bjz_m60MjGCLjU3IOQxtPgoNTA/formResponse";
            
            const formData = new URLSearchParams();
            formData.append("entry.141195573", reviewId); // Review ID field
            formData.append("entry.1251691115", decision); // Decision field
            formData.append("entry.328901112", userName); // User name field

            fetch(formURL, {
                method: "POST",
                body: formData,
                mode: "no-cors"
            }).then(() => {
                alert("Response submitted!");
                moveToNextReview();
            }).catch(error => {
                console.error("Error submitting form:", error);
                alert("Failed to submit response. Please try again.");
            });
        }

        // Move to the next review (if needed)
        function moveToNextReview() {
            if (currentReviewIndex < reviewData.length) {
                renderReviews();
            } else {
                document.getElementById('reviewContent').innerHTML = "<h2>Thank you for completing the challenge!</h2>";
            }
        }

    </script>
</body>
</html>
